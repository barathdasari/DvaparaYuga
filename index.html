<title>Dvapara Yuga — Celestial Lineage Cosmos</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;font-family:system-ui,sans-serif;background:#F4F2EE;
    display:flex;align-items:center;justify-content:center;text-align:center}
  .wrap{padding:32px 24px;max-width:340px}
  .icon{width:60px;height:60px;background:linear-gradient(135deg,#7B5CF0,#5B3BD0);
    border-radius:18px;display:flex;align-items:center;justify-content:center;
    font-size:28px;margin:0 auto 20px;box-shadow:0 8px 24px rgba(108,79,191,.3)}
  h1{font-size:22px;font-weight:800;color:#0D0D1A;letter-spacing:-.01em;margin-bottom:6px}
  p{font-size:13px;color:#8888AA;line-height:1.5;margin-bottom:28px}
  .deva{font-family:serif;font-size:15px;color:#6C4FBF;margin-bottom:4px}
  a{display:inline-flex;align-items:center;gap:8px;padding:12px 28px;
    background:linear-gradient(135deg,#6C4FBF,#4A30A0);color:#fff;
    border-radius:12px;text-decoration:none;font-size:14px;font-weight:700;
    box-shadow:0 4px 16px rgba(108,79,191,.35)}
  .dot{width:6px;height:6px;border-radius:50%;background:#9B72F0;
    display:inline-block;animation:pulse .9s ease-in-out infinite}
  .dot:nth-child(2){animation-delay:.2s} .dot:nth-child(3){animation-delay:.4s}
  .dots{display:flex;gap:5px;justify-content:center;margin-top:20px}
  @keyframes pulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="icon">☸</div>
  <div class="deva">द्वापर युग</div>

    <span class="dot"></span><span class="dot"></span><span class="dot"></span>
  </div>
</div>
